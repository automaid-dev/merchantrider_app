name: automaid_merchantrider
description: Automaid Partner — combined rider (delivery) and merchant (wash outlet) app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.2.0

  # QR scanning (rider scan flow)
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Photo capture (delivery proof, document uploads)
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Map location picker (registration address confirmation)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Utilities
  intl: ^0.19.0
  json_annotation: ^4.9.0

  # Brand type (friendly, rounded — matches the LaundryBar/Automaid mascot)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
